{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold">Add New Client</h2>
        <a href="{{ url_for('clients_list') }}" class="text-slate-400 hover:text-slate-200 text-sm">Cancel</a>
    </div>

    <form method="POST" class="bg-lightCard dark:bg-darkCard p-8 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-2">Company Name *</label>
            <input type="text" name="company_name" required placeholder="e.g. SIGA METAL" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Contact Person</label>
                <input type="text" name="contact_name" placeholder="e.g. Hamza Atia" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Matricule Fiscal (MF)</label>
                <input type="text" name="tax_id" placeholder="e.g. 1234567/A/M/000" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Phone Number</label>
                <input type="text" name="phone" placeholder="+216 XX XXX XXX" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Email Address</label>
                <input type="email" name="email" placeholder="client@company.tn" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-2">Address</label>
            <textarea name="address" rows="3" placeholder="Full address in Tunisia" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand"></textarea>
        </div>

        <button type="submit" class="w-full py-3 bg-brand text-white font-bold rounded-xl hover:bg-brandHover shadow-lg shadow-brand/20 transition">
            Save Client Profile
        </button>
    </form>
</div>
{% endblock %}
