{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold">Edit Client: {{ client.company_name }}</h2>
        <a href="{{ url_for('clients.clients_list') }}" class="text-slate-400 hover:text-slate-200 text-sm">Cancel</a>
    </div>

    <form method="POST" class="bg-lightCard dark:bg-darkCard p-8 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-2">Company Name *</label>
            <input type="text" name="company_name" value="{{ client.company_name }}" required class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Contact Person</label>
                <input type="text" name="contact_name" value="{{ client.contact_name or '' }}" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Matricule Fiscal (MF)</label>
                <input type="text" name="tax_id" value="{{ client.tax_id or '' }}" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Phone Number</label>
                <input type="text" name="phone" value="{{ client.phone or '' }}" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Email Address</label>
                <input type="email" name="email" value="{{ client.email or '' }}" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-2">Address</label>
            <textarea name="address" rows="3" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">{{ client.address or '' }}</textarea>
        </div>

        <button type="submit" class="w-full py-3 bg-brand text-white font-bold rounded-xl hover:bg-brandHover shadow-lg shadow-brand/20 transition">
            Update Client Profile
        </button>
    </form>
</div>
{% endblock %}
