{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold">Add New Worker</h2>
        <a href="{{ url_for('workers_list') }}" class="text-slate-400 hover:text-slate-200 text-sm">Cancel</a>
    </div>

    <form method="POST" action="{{ url_for('worker_create') }}" class="bg-lightCard dark:bg-darkCard p-8 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-2">Full Name *</label>
            <input type="text" name="full_name" required placeholder="e.g. Mohamed Ali" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-brand">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Role / Trade *</label>
                <input type="text" name="role" required placeholder="e.g. Welder / Press Operator" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-brand">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Monthly Salary Rate (TND/month) *</label>
                <input type="number" step="any" name="monthly_rate" required placeholder="e.g. 1200.000" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-brand">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Phone Number</label>
                <input type="text" name="phone" placeholder="+216 XX XXX XXX" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-brand">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">CIN Number</label>
                <input type="text" name="cin_number" placeholder="e.g. 12345678" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm text-slate-100 focus:outline-none focus:border-brand">
            </div>
        </div>

        <button type="submit" class="w-full py-3 bg-brand text-white font-bold rounded-xl hover:bg-brandHover shadow-lg shadow-brand/20 transition">
            Add Worker Profile
        </button>
    </form>
</div>
{% endblock %}
