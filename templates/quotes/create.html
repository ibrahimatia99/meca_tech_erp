{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold text-slate-100">Create New Quote / Devis</h2>
            <p class="text-xs text-slate-400">Auto-generated Monthly Reference: <strong class="text-brand font-mono">{{ auto_ref }}</strong></p>
        </div>
        <a href="{{ url_for('quotes_list') }}" class="text-slate-400 hover:text-slate-200 text-sm">Cancel</a>
    </div>

    <form method="POST" action="{{ url_for('quote_create') }}" class="bg-lightCard dark:bg-darkCard p-8 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-6">
        
        <!-- TOP METADATA & CLIENT SELECTION -->
        <div class="grid grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Quote Reference Number *</label>
                <input type="text" name="quote_number" value="{{ auto_ref }}" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm font-bold text-brand font-mono focus:outline-none focus:border-brand">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Select Client *</label>
                <select name="client_id" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-sm font-bold text-slate-200 focus:outline-none focus:border-brand">
                    {% for c in clients %}
                        <option value="{{ c.id }}">{{ c.company_name }} ({{ c.contact_name or 'N/A' }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- LINE ITEMS TABLE -->
        <div class="space-y-3">
            <label class="block text-xs font-semibold text-slate-400">Line Items & Metalworking Services *</label>
            <div id="items-container" class="space-y-3">
                <div class="flex gap-3 item-row">
                    <input type="text" name="item_description[]" required placeholder="Item description / Laser Cutting / Bending / Assembly" class="flex-1 px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
                    <input type="number" step="any" name="item_quantity[]" value="1" required placeholder="Qty" class="w-24 px-3 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
                    <input type="number" step="any" name="item_rate[]" required placeholder="Rate (TND)" class="w-32 px-3 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
                </div>
            </div>
            <button type="button" onclick="addRow()" class="text-xs font-bold text-brand hover:underline pt-1">+ Add Another Line Item</button>
        </div>

        <!-- REMARQUE & COMMERCIAL CONDITIONS -->
        <div class="border-t border-slate-800 pt-4 space-y-4">
            <h4 class="text-xs font-bold uppercase text-slate-400 tracking-wider">Document Conditions & Remarques</h4>
            
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Remarque / Special Instructions</label>
                <textarea name="remarque" rows="2" placeholder="e.g. Matière première fournies par le client / Tolérance selon ISO 2768-m" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Conditions de Règlement</label>
                    <input type="text" name="payment_terms" value="Paiement à la livraison / Chèque" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Validité de l'Offre</label>
                    <input type="text" name="validite_offre" value="30 Jours" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Délai de Livraison</label>
                    <input type="text" name="delai_livraison" value="Selon disponibilité du stock / Planning atelier" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Mode d'Expédition</label>
                    <input type="text" name="mode_expedition" value="Par nos soins / Transport client" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
                </div>
            </div>
        </div>

        <!-- DRIVER & LOGISTICS (OPTIONAL FOR BON DE LIVRAISON) -->
        <div class="border-t border-slate-800 pt-4 space-y-3">
            <h4 class="text-xs font-bold uppercase text-slate-400 tracking-wider">Transport & Chauffeur (Bon de Livraison)</h4>
            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nom du Chauffeur</label>
                    <input type="text" name="driver_name" placeholder="Optional" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">CIN Chauffeur</label>
                    <input type="text" name="driver_cin" placeholder="Optional" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Matricule Véhicule</label>
                    <input type="text" name="vehicle_plate" placeholder="Optional" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
                </div>
            </div>
        </div>

        <!-- DISCOUNT & SUBMIT -->
        <div class="border-t border-slate-800 pt-4 grid grid-cols-2 gap-4 items-center">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Discount Rate (%)</label>
                <input type="number" step="any" name="discount_rate" value="0.0" class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
            </div>
            <div class="pt-5">
                <button type="submit" class="w-full py-3 bg-brand text-white font-bold rounded-xl hover:bg-brandHover shadow-lg shadow-brand/20 transition">
                    Generate & Save Quote
                </button>
            </div>
        </div>

    </form>
</div>

<script>
function addRow() {
    const container = document.getElementById('items-container');
    const newRow = document.createElement('div');
    newRow.className = 'flex gap-3 item-row';
    newRow.innerHTML = `
        <input type="text" name="item_description[]" required placeholder="Item description" class="flex-1 px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
        <input type="number" step="any" name="item_quantity[]" value="1" required placeholder="Qty" class="w-24 px-3 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
        <input type="number" step="any" name="item_rate[]" required placeholder="Rate (TND)" class="w-32 px-3 py-2.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-brand">
    `;
    container.appendChild(newRow);
}
</script>
{% endblock %}
