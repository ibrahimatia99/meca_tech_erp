<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Login - Meca Tech Atia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#FF5500',
                        darkBg: '#13151D',
                        darkCard: '#1C1E2A'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-darkCard p-8 rounded-2xl border border-slate-800 shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <div class="bg-brand text-white w-12 h-12 rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto mb-3">M</div>
            <h2 class="text-2xl font-bold">Meca Tech Atia</h2>
            <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">Management Portal</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 mb-4 rounded-xl text-xs font-semibold text-center {% if category == 'error' %}bg-red-500/10 text-red-400 border border-red-500/20{% else %}bg-green-500/10 text-green-400 border border-green-500/20{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-3 bg-darkBg border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-3 bg-darkBg border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
            <button type="submit" class="w-full py-3 bg-brand text-white font-semibold rounded-xl hover:bg-brand/90 transition shadow-lg shadow-brand/20">
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
