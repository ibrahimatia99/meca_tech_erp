{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold">Edit Machine: {{ machine.name }}</h2>
        <a href="{{ url_for('machines.machine_detail', machine_id=machine.id) }}" class="text-slate-400 hover:text-slate-200 text-sm">Cancel</a>
    </div>

    <form method="POST" class="bg-lightCard dark:bg-darkCard p-8 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-2">Machine Name *</label>
            <input type="text" name="name" value="{{ machine.name }}" required class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Model / Type</label>
                <input type="text" name="model_type" value="{{ machine.model_type or '' }}" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Serial Number</label>
                <input type="text" name="serial_number" value="{{ machine.serial_number or '' }}" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-2">Technical Notes / Specs</label>
            <textarea name="notes" rows="3" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">{{ machine.notes or '' }}</textarea>
        </div>

        <button type="submit" class="w-full py-3 bg-brand text-white font-bold rounded-xl hover:bg-brandHover shadow-lg shadow-brand/20 transition">
            Update Machine Profile
        </button>
    </form>
</div>
{% endblock %}
