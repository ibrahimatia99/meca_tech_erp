{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold">Add Raw Material Stock</h2>
        <a href="{{ url_for('stock.stock_list') }}" class="text-slate-400 hover:text-slate-200 text-sm">Cancel</a>
    </div>

    <form method="POST" class="bg-lightCard dark:bg-darkCard p-8 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-400 mb-2">Item Name / Description *</label>
            <input type="text" name="name" required placeholder="e.g. Tôle Noire 3mm (2000x1000mm)" class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Initial Quantity</label>
                <input type="number" step="0.1" name="quantity" value="10" required class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Min Stock Alert Threshold</label>
                <input type="number" step="0.1" name="min_stock_alert" value="3" required class="w-full px-4 py-2.5 bg-lightBg dark:bg-darkBg border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand">
            </div>
        </div>

        <button type="submit" class="w-full py-3 bg-brand text-white font-bold rounded-xl hover:bg-brandHover shadow-lg shadow-brand/20 transition">
            Add Stock Item
        </button>
    </form>
</div>
{% endblock %}
